name: Actualizar datos

on:
  schedule:
    - cron: "0 21 * * *"   # todos los días, 21:00 UTC (18:00 Argentina)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar el monitor
        # El script sale con 1 cuando hay alertas (es normal); con 2 no pudo leer nada (es error).
        run: python3 monitor_ahorros.py --out docs || [ $? -eq 1 ]

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json historial_ahorros.csv
          git diff --cached --quiet || git commit -m "Actualizar datos"
          git push
