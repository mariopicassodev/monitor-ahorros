name: Actualizar datos

on:
  schedule:
    - cron: "0 21 * * *"   # todos los días, 21:00 UTC (18:00 Argentina)
  workflow_dispatch:        # ejecutarlo a mano desde la pestaña Actions (sirve para probar en un fork)
  push:
    branches: [main]
    paths: [docs/index.html, monitor_ahorros.py, .github/workflows/actualizar.yml]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la rama gh-pages (donde se publican los datos)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add site FETCH_HEAD
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rqf .
          fi
          cp site/historial_ahorros.csv . 2>/dev/null || true

      - name: Ejecutar el monitor
        # El script sale con 1 cuando hay alertas (es normal); con 2 no pudo leer nada (es error).
        run: python3 monitor_ahorros.py --out site || [ $? -eq 1 ]

      - name: Publicar en gh-pages
        run: |
          cp docs/index.html site/index.html
          cp historial_ahorros.csv site/ 2>/dev/null || true
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Actualizar datos"
          git push origin HEAD:gh-pages
